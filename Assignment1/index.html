

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>Student Portal</h2>
        <div>
            <a href="#registration">Registration</a>
            <a href="#result">Result</a>
        </div>
    </nav>

    <section class="container" id="registration">
        <h2>Student Registration</h2>

        <form id="studentForm">
            <div class="form-grid">
                <div>
                    <label for="name">Student Name</label>
                    <input type="text" id="name" placeholder="Enter name" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>

                <div>
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="Enter student ID" required>
                </div>

                <div>
                    <label for="course">Course</label>
                    <select id="course" required>
                        <option value="">Select Course</option>
                        <option>B.Tech CSE</option>
                        <option>BCA</option>
                        <option>MCA</option>
                        <option>B.Sc IT</option>
                    </select>
                </div>

                <div>
                    <label for="html">HTML Marks</label>
                    <input type="number" id="html" min="0" max="100" required>
                </div>

                <div>
                    <label for="css">CSS Marks</label>
                    <input type="number" id="css" min="0" max="100" required>
                </div>

                <div>
                    <label for="js">JavaScript Marks</label>
                    <input type="number" id="js" min="0" max="100" required>
                </div>
            </div>

            <button type="submit">Generate Result</button>
        </form>
    </section>

    <section class="container" id="result">
        <h2>Student Result</h2>
        <p>Your result will appear here.</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
